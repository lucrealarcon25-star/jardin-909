<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jardín de Infantes N.º 909 · Malvinas Argentinas</title>
  <meta name="description" content="Sitio institucional del Jardín de Infantes N.º 909 Malvinas Argentinas, Morón, Provincia de Buenos Aires.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <!-- Cuando cambies styles.css, app.js o contenido.js, subí el número ?v= para que los celulares no muestren la versión vieja -->
  <link rel="icon" href="assets/favicon.png">
  <!-- Si usás IvySoft desde Adobe Fonts, pegá aquí el <link> de tu proyecto web -->
  <link rel="stylesheet" href="styles.css?v=43">
  <!-- Primero el contenido editable, después la lógica -->
  <script src="contenido.js?v=43" defer></script>
  <script src="app.js?v=43" defer></script>
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <!-- Aviso de vista de propuesta (se controla desde contenido.js) -->
  <div class="aviso" id="aviso" hidden></div>

  <!-- ENCABEZADO -->
  <header class="encabezado" id="encabezado">
    <div class="contenedor encabezado__fila">
      <a class="marca" id="marca" href="#inicio"></a>

      <button class="menu-boton" id="menu-boton" type="button"
              aria-expanded="false" aria-controls="menu-principal">
        <span class="menu-boton__icono" aria-hidden="true"><span></span></span>
        <span class="menu-boton__texto">Menú</span>
      </button>

      <nav class="navegacion" aria-label="Principal">
        <ul class="navegacion__lista" id="menu-principal"></ul>
      </nav>
    </div>
  </header>

  <main id="contenido" tabindex="-1">
    <!-- Trama de la marca (fondo decorativo) -->
    <div class="trama" aria-hidden="true"></div>
    <noscript>
      <p class="contenedor sin-js">Para ver el contenido del sitio es necesario activar JavaScript en el navegador.</p>
    </noscript>

    <!-- 1. INICIO -->
    <section class="portada" id="inicio" aria-labelledby="portada-titulo">
      <div class="contenedor portada__grilla">
        <div class="portada__texto">
          <h1 class="portada__titulo" id="portada-titulo" data-texto="portada.titulo"></h1>
          <p class="portada__bajada" data-texto="portada.bajada"></p>
        </div>
        <div class="portada__ilustracion" id="portada-ilustracion"></div>
      </div>
    </section>

    <!-- 2. NUESTRO JARDÍN -->
    <section class="seccion" id="jardin" aria-labelledby="jardin-titulo">
      <div class="contenedor seccion__interior">
        <h2 class="seccion__titulo" id="jardin-titulo" data-texto="jardin.titulo"></h2>
        <p class="jardin__lema" data-texto="jardin.lema"></p>
        <p class="jardin__presentacion" data-texto="jardin.presentacion"></p>
        <div class="apartados" id="jardin-apartados"></div>
      </div>
    </section>

    <!-- 3. NUESTRAS SALAS -->
    <section class="seccion" id="salas" aria-labelledby="salas-titulo">
      <div class="contenedor seccion__interior">
        <h2 class="seccion__titulo" id="salas-titulo" data-texto="salas.titulo"></h2>
        <p class="seccion__bajada" data-texto="salas.bajada"></p>
        <ul class="salas" id="salas-lista"></ul>
      </div>
    </section>

    <!-- 4. PROYECTOS Y EXPERIENCIAS -->
    <section class="seccion" id="proyectos" aria-labelledby="proyectos-titulo">
      <div class="contenedor seccion__interior">
        <h2 class="seccion__titulo" id="proyectos-titulo" data-texto="proyectos.titulo"></h2>
        <p class="seccion__bajada" data-texto="proyectos.bajada"></p>
        <ul class="proyectos" id="proyectos-lista"></ul>
      </div>
    </section>

    <!-- 5. NOVEDADES Y COMUNICACIONES -->
    <section class="seccion" id="novedades" aria-labelledby="novedades-titulo">
      <div class="contenedor seccion__interior">
        <h2 class="seccion__titulo" id="novedades-titulo" data-texto="novedades.titulo"></h2>
        <div class="filtros" id="novedades-filtros" role="tablist" aria-label="Filtrar publicaciones"></div>
        <div id="novedades-panel" role="tabpanel" tabindex="0">
          <ul class="novedades" id="novedades-lista"></ul>
        </div>
      </div>
    </section>


    <!-- 6. CONTACTO -->
    <section class="seccion" id="contacto" aria-labelledby="contacto-titulo">
      <div class="contenedor seccion__interior">
        <h2 class="seccion__titulo" id="contacto-titulo" data-texto="contacto.titulo"></h2>
        <div class="contacto" id="contacto-datos"></div>
        <ul class="enlaces-institucionales" id="contacto-enlaces" hidden></ul>
        <div class="contacto-mapa" id="contacto-mapa" hidden></div>
        <div class="contacto-form" id="contacto-formulario" hidden></div>
        <p class="contacto__nota" id="contacto-nota" hidden></p>
      </div>
    </section>
  </main>

  <!-- PIE -->
  <footer class="pie">
    <div class="contenedor pie__fila">
      <div class="pie__marca" id="pie-marca"></div>
      <p class="pie__texto" id="pie-texto"></p>
      <nav class="pie__nav" aria-label="Páginas">
        <a class="pie__anterior" id="pie-anterior" href="#inicio" hidden></a>
        <a class="pie__volver" id="pie-volver" href="#inicio"></a>
      </nav>
    </div>
  </footer>

</body>
</html>
